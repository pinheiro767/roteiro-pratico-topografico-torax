<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#75543c"><title>Atlas Digital de Anatomia Humana — Tórax</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top"><div class="brand"><b>A</b><span><strong>Atlas Digital de Anatomia Humana</strong><small>Tórax • 94 estruturas</small></span></div><button id="theme">🎨 Aparência</button></header>
<div id="themebox" class="themebox" hidden><label>Destaque <input id="accent" type="color" value="#75543c"></label><label>Fundo <input id="bg" type="color" value="#f3efe9"></label></div>
<div class="shell">
<aside><input id="search" placeholder="Buscar estrutura…"><div id="coverage"></div><nav id="nav"></nav></aside>
<main><section class="hero"><div><small>ATLAS INTERATIVO</small><h1>Tórax</h1><p>Clique em um dos 94 nomes. A imagem só aparece quando a ficha é aberta.</p></div><strong>94</strong></section><div id="sections"></div></main>
</div>
<div id="modal" class="modal" hidden>
<div class="sheet">

<div class="detail">
<div>
<div id="stage" class="stage"><div id="ph"><b id="expected"></b><span>Coloque este arquivo na pasta images.</span></div><img id="img" hidden></div>
<div class="zoom"><button id="minus">−</button><button id="reset">100%</button><button id="plus">+</button></div>
<div id="gallery" class="gallery"></div>
</div>
<section class="info"><div class="infoBox"><small>LOCALIZAÇÃO ANATÔMICA</small><p id="loc"></p></div><div class="infoBox"><small>ARQUIVO</small><p id="file"></p></div><label class="act primary">📎 Anexar fotos<input id="attach" type="file" accept="image/*" multiple></label><label class="act">📷 Tirar foto<input id="camera" type="file" accept="image/*" capture="environment"></label></section>
</div></div></div>
<script src="structures.js"></script><script src="app.js"></script></body></html>
